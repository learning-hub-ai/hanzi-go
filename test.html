<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HanziGo — Test Suite</title>
<style>
body{font-family:-apple-system,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#1e293b}
h1{color:#4f46e5}
.controls{display:flex;gap:8px;margin-bottom:16px;align-items:center}
#runBtn{padding:10px 24px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
#runBtn:hover{background:#3730a3}
.filter-btn{padding:6px 14px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;color:#64748b}
.filter-btn.active{background:#fef2f2;border-color:#fca5a5;color:#dc2626;font-weight:600}
.test-group{margin:12px 0;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.test-group.all-pass{border-color:#d1fae5}
.test-group.has-fail{border-color:#fecaca}
.test-group-header{background:#f8fafc;margin:0;padding:10px 16px;border-bottom:1px solid #e2e8f0;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.test-group.all-pass .test-group-header{background:#f0fdf4}
.test-group.has-fail .test-group-header{background:#fef2f2}
.test-group-header:hover{background:#f1f5f9}
.test-group-count{font-size:11px;color:#64748b;background:#e2e8f0;padding:2px 8px;border-radius:10px}
.test-group.has-fail .test-group-count{background:#fecaca;color:#dc2626}
.test-group-body{display:none}
.test-group.expanded .test-group-body{display:block}
.test-group.has-fail .test-group-body{display:block}
.test{padding:6px 16px;border-bottom:1px solid #f1f5f9;font-size:12px;display:flex;align-items:center;gap:8px}
.test:last-child{border-bottom:none}
.pass{color:#059669}
.fail{color:#ef4444;font-weight:600}
.pass::before{content:'✅ '}
.fail::before{content:'❌ '}
.hidden-test{display:none}
.summary{margin-top:24px;padding:16px;border-radius:8px;font-size:15px;font-weight:600}
.summary.all-pass{background:#dcfce7;color:#166534}
.summary.has-fail{background:#fef2f2;color:#991b1b}
iframe{width:100%;height:0;border:none;position:absolute;left:-9999px}
</style>
</head>
<body>
<h1>🧪 HanziGo Test Suite</h1>
<p>Automated tests to verify app functionality. Tests load the app in a hidden iframe.</p>
<div class="controls">
  <button id="runBtn" onclick="runTests()">▶ Run All Tests</button>
  <button class="filter-btn" id="filterBtn" onclick="toggleFilter()">Show failures only</button>
  <button class="filter-btn" id="collapseBtn" onclick="collapseAll()">Collapse all</button>
  <button class="filter-btn" id="expandBtn" onclick="expandAll()">Expand all</button>
</div>
<div id="results"><p style="color:#999">Click "Run All Tests" to start</p></div>

<!-- Hidden iframe loads the real app -->
<iframe id="appFrame" src="index.html"></iframe>

<script>
let tests = [];
let passed = 0;
let failed = 0;
let app; // reference to iframe's window

function describe(group, fn) { tests.push({ group, tests: [] }); fn(); }
function it(name, fn) {
  const group = tests[tests.length - 1];
  try { fn(); group.tests.push({ name, pass: true }); passed++; }
  catch (e) { group.tests.push({ name, pass: false, error: e.message }); failed++; }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg) { if (a !== b) throw new Error(msg || `Expected ${b}, got ${a}`); }
function assertGreater(a, min, msg) { if (a <= min) throw new Error(msg || `Expected > ${min}, got ${a}`); }

function renderResults() {
  let html = '';
  tests.forEach(group => {
    const groupFailed = group.tests.some(t => !t.pass);
    const groupClass = groupFailed ? 'has-fail expanded' : 'all-pass';
    const passCount = group.tests.filter(t => t.pass).length;
    const failCount = group.tests.filter(t => !t.pass).length;
    const countLabel = groupFailed ? `${failCount} failed` : `${passCount} passed`;

    html += `<div class="test-group ${groupClass}">`;
    html += `<div class="test-group-header" onclick="this.parentElement.classList.toggle('expanded')">
      <span>${groupFailed ? '❌' : '✅'} ${group.group}</span>
      <span class="test-group-count">${countLabel}</span>
    </div>`;
    html += `<div class="test-group-body">`;
    group.tests.forEach(t => {
      html += `<div class="test ${t.pass?'pass':'fail'}">${t.name}${t.error?' — '+t.error:''}</div>`;
    });
    html += '</div></div>';
  });
  html += `<div class="summary ${failed?'has-fail':'all-pass'}">${passed} passed, ${failed} failed (${passed+failed} total across ${tests.length} groups)</div>`;
  document.getElementById('results').innerHTML = html;
}

function toggleFilter() {
  const btn = document.getElementById('filterBtn');
  const groups = document.querySelectorAll('.test-group');
  btn.classList.toggle('active');
  const showFailOnly = btn.classList.contains('active');
  btn.textContent = showFailOnly ? 'Show all tests' : 'Show failures only';
  groups.forEach(g => {
    if (showFailOnly && g.classList.contains('all-pass')) {
      g.style.display = 'none';
    } else {
      g.style.display = '';
    }
  });
}

function collapseAll() {
  document.querySelectorAll('.test-group').forEach(g => g.classList.remove('expanded'));
}

function expandAll() {
  document.querySelectorAll('.test-group').forEach(g => g.classList.add('expanded'));
}

async function runTests() {
  tests = []; passed = 0; failed = 0;
  document.getElementById('results').innerHTML = '<p>Loading app in iframe...</p>';

  // Wait for iframe to load
  const frame = document.getElementById('appFrame');
  await new Promise(resolve => {
    if (frame.contentDocument.readyState === 'complete') resolve();
    else frame.onload = resolve;
  });

  // Wait for app to finish initializing (data loading is async)
  app = frame.contentWindow;
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 500));
    try {
      if (app.State && app.State.get('allChars') && app.State.get('allChars').length > 0) break;
    } catch(e) {}
  }

  if (!app.State) {
    document.getElementById('results').innerHTML = '<p style="color:red">❌ Failed: app.State not accessible. Make sure test.html is served from the same origin (http://localhost:8080/test.html)</p>';
    return;
  }

  // === 1. Data Files ===
  describe('📂 Data Files', () => {
    it('allChars is loaded and non-empty', () => {
      const chars = app.State.get('allChars');
      assert(Array.isArray(chars), 'allChars should be array');
      assertGreater(chars.length, 100, `Only ${chars.length} chars loaded`);
    });

    it('Lessons loaded from multiple grades', () => {
      const lessons = app.State.get('lessons');
      assertGreater(lessons.length, 50, `Only ${lessons.length} lessons`);
    });

    it('Each char has required fields', () => {
      const chars = app.State.get('allChars');
      const sample = chars.slice(0, 50);
      sample.forEach(c => {
        assert(c.char && c.char.length === 1, `Bad char: ${c.char}`);
        assert(c.pinyin, `Missing pinyin for ${c.char}`);
        assert(c.words && c.words.length >= 1, `Missing words for ${c.char}`);
        assert(c.sentence, `Missing sentence for ${c.char}`);
      });
    });

    it('Chars contain the character in their sentence', () => {
      const chars = app.State.get('allChars');
      let missing = 0;
      chars.forEach(c => { if (!c.sentence.includes(c.char)) missing++; });
      assertEqual(missing, 0, `${missing} chars not in their sentence`);
    });
  });

  // === 2. HTML Structure ===
  describe('🏗️ HTML Structure', () => {
    const doc = frame.contentDocument;

    it('Critical learning elements exist', () => {
      const ids = ['flashcard', 'cardChar', 'favBtn', 'btnPrev', 'btnNext', 'btnFlip', 'btnSpeak', 'btnReinforce'];
      const missing = ids.filter(id => !doc.getElementById(id));
      assertEqual(missing.length, 0, `Missing: ${missing.join(', ')}`);
    });

    it('Critical challenge elements exist', () => {
      const ids = ['challengeMode', 'quizTypeSelector', 'quizOptions', 'btnPlayAgain'];
      const missing = ids.filter(id => !doc.getElementById(id));
      assertEqual(missing.length, 0, `Missing: ${missing.join(', ')}`);
    });

    it('Header elements exist', () => {
      const ids = ['streakNumber', 'btnProfile', 'btnFavorites', 'btnErrorBook', 'btnBadges'];
      const missing = ids.filter(id => !doc.getElementById(id));
      assertEqual(missing.length, 0, `Missing: ${missing.join(', ')}`);
    });

    it('Sidebar has grade items', () => {
      const items = doc.querySelectorAll('.sidebar-item[data-grade]');
      assertGreater(items.length, 10, `Only ${items.length} sidebar items`);
    });

    it('Mode tabs have data-mode', () => {
      const tabs = doc.querySelectorAll('.mode-tab[data-mode]');
      assertEqual(tabs.length, 3, 'Should have 3 mode tabs (任务, 学习, 挑战)');
    });
  });

  // === 3. JS Modules ===
  describe('📦 JS Modules', () => {
    it('State module loaded', () => {
      assert(typeof app.State !== 'undefined');
      assert(typeof app.State.get === 'function');
      assert(typeof app.State.set === 'function');
      assert(typeof app.State.config === 'function');
    });

    it('DataService module loaded', () => {
      assert(typeof app.DataService !== 'undefined');
      assert(typeof app.DataService.generateQuizQuestions === 'function');
    });

    it('Speech module loaded', () => {
      assert(typeof app.Speech !== 'undefined');
      assert(typeof app.Speech.speak === 'function');
    });

    it('BadgeService has 11 badges', () => {
      assertEqual(app.BadgeService.getAll().length, 11, 'Should have 11 badges');
    });

    it('LearnController loaded', () => {
      assert(typeof app.LearnController.next === 'function');
      assert(typeof app.LearnController.prev === 'function');
      assert(typeof app.LearnController.flip === 'function');
      assert(typeof app.LearnController.reinforce === 'function');
    });

    it('ChallengeController loaded', () => {
      assert(typeof app.ChallengeController.start === 'function');
      assert(typeof app.ChallengeController.setType === 'function');
    });

    it('ProfileManager loaded', () => {
      assert(typeof app.ProfileManager !== 'undefined');
      assert(typeof app.ProfileManager.getProfiles === 'function');
    });
  });

  // === 4. Quiz Logic ===
  describe('🎮 Quiz Logic', () => {
    it('Generates pickPinyin questions', () => {
      const q = app.DataService.generateQuizQuestions(false, 'pickPinyin', 5);
      assert(q !== null, 'Should generate questions');
      assertGreater(q.length, 0, 'Should have questions');
      assertEqual(q[0].type, 'pickPinyin');
      assertEqual(q[0].options.length, 4, 'Should have 4 options');
    });

    it('Generates pickChar questions', () => {
      const q = app.DataService.generateQuizQuestions(false, 'pickChar', 5);
      assert(q !== null);
      assertEqual(q[0].type, 'pickChar');
    });

    it('Generates fillBlank questions', () => {
      const q = app.DataService.generateQuizQuestions(false, 'fillBlank', 5);
      assert(q !== null);
      // fillBlank may fall back to pickChar for some chars
      assert(q[0].type === 'fillBlank' || q[0].type === 'pickChar');
    });

    it('Generates mixed questions', () => {
      const q = app.DataService.generateQuizQuestions(false, 'mixed', 10);
      assert(q !== null);
      const types = new Set(q.map(x => x.type));
      assertGreater(types.size, 1, 'Mixed should have multiple types');
    });

    it('Correct answer is always in options', () => {
      const q = app.DataService.generateQuizQuestions(false, 'pickPinyin', 10);
      q.forEach(question => {
        assert(question.options.includes(question.target), 'Target must be in options');
      });
    });
  });

  // === 5. Badge System ===
  describe('🏆 Badge System', () => {
    it('All badges have required fields', () => {
      app.BadgeService.getAll().forEach(b => {
        assert(b.id, `Missing id`);
        assert(b.emoji, `${b.id} missing emoji`);
        assert(b.name, `${b.id} missing name`);
        assert(b.desc !== undefined, `${b.id} missing desc`);
        assert(typeof b.check === 'function', `${b.id} missing check`);
      });
    });

    it('Badge IDs are unique', () => {
      const ids = app.BadgeService.getAll().map(b => b.id);
      assertEqual(ids.length, new Set(ids).size, 'Duplicate badge IDs');
    });

    it('checkAndAward returns array', () => {
      const result = app.BadgeService.checkAndAward();
      assert(Array.isArray(result), 'Should return array');
    });
  });

  // === 6. Profile System ===
  describe('👤 Profiles', () => {
    it('At least one profile exists', () => {
      assertGreater(app.ProfileManager.getProfiles().length, 0, 'No profiles');
    });

    it('Profile has id, name, avatar', () => {
      const p = app.ProfileManager.getProfiles()[0];
      assert(p.id, 'Missing id');
      assert(p.name, 'Missing name');
      assert(p.avatar, 'Missing avatar');
    });

    it('State has active profile', () => {
      const id = app.State.getProfileId();
      assert(id && id.length > 0, 'No active profile ID');
    });
  });

  // === 7. Streak Logic ===
  describe('🔥 Streak', () => {
    it('Stats has consecutiveDays field', () => {
      const stats = app.State.get('stats');
      assert(stats.consecutiveDays !== undefined, 'Missing consecutiveDays');
    });

    it('Streak display shows a number', () => {
      const el = frame.contentDocument.getElementById('streakNumber');
      assert(el, 'streakNumber element missing');
      const num = parseInt(el.textContent);
      assert(!isNaN(num), `Streak should be a number, got: ${el.textContent}`);
    });
  });

  // === 8. Timer ===
  describe('⏱️ Timer', () => {
    it('Timer select element exists', () => {
      const el = frame.contentDocument.getElementById('quizTimerSelect');
      assert(el, 'quizTimerSelect not found');
    });

    it('Timer bar element exists', () => {
      const el = frame.contentDocument.getElementById('quizTimerBar');
      assert(el, 'quizTimerBar not found');
    });

    it('Timer bar has pointer-events:none', () => {
      const el = frame.contentDocument.getElementById('quizTimerBar');
      const style = frame.contentWindow.getComputedStyle(el);
      assertEqual(style.pointerEvents, 'none', 'Timer bar should not block clicks');
    });

    it('setTimer function exists', () => {
      assert(typeof app.ChallengeController.setTimer === 'function');
    });

    it('Timer options are 0, 5, 10, 15', () => {
      const el = frame.contentDocument.getElementById('quizTimerSelect');
      const values = Array.from(el.options).map(o => o.value);
      assert(values.includes('0'), 'Missing 0 (off)');
      assert(values.includes('5'), 'Missing 5');
      assert(values.includes('10'), 'Missing 10');
      assert(values.includes('15'), 'Missing 15');
    });
  });

  // === 9. Spaced Repetition (智能复习) ===
  describe('📈 Spaced Repetition — Module API', () => {
    it('SpacedRepService module exists with all methods', () => {
      assert(typeof app.SpacedRepService !== 'undefined', 'SpacedRepService not defined');
      assert(typeof app.SpacedRepService.recordAnswer === 'function', 'recordAnswer missing');
      assert(typeof app.SpacedRepService.getDueChars === 'function', 'getDueChars missing');
      assert(typeof app.SpacedRepService.getDueCount === 'function', 'getDueCount missing');
      assert(typeof app.SpacedRepService.getTotalCount === 'function', 'getTotalCount missing');
      assert(typeof app.SpacedRepService.getStats === 'function', 'getStats missing');
      assert(typeof app.SpacedRepService.resetCache === 'function', 'resetCache missing');
    });

    it('getStats returns all 5 box counts', () => {
      const stats = app.SpacedRepService.getStats();
      assert(stats.box1 !== undefined, 'Missing box1');
      assert(stats.box2 !== undefined, 'Missing box2');
      assert(stats.box3 !== undefined, 'Missing box3');
      assert(stats.box4 !== undefined, 'Missing box4');
      assert(stats.box5 !== undefined, 'Missing box5');
    });

    it('getDueCount matches getDueChars length', () => {
      const count = app.SpacedRepService.getDueCount();
      const chars = app.SpacedRepService.getDueChars();
      assertEqual(count, chars.length, `getDueCount=${count} but getDueChars.length=${chars.length}`);
    });
  });

  describe('📈 Spaced Repetition — Box Promotion (Correct Answers)', () => {
    it('First correct answer: enters system at Box 2 (not due today)', () => {
      // Use a unique char unlikely to be in the system already
      const testChar = '鑫';
      // Clear by recording fresh
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      delete data[testChar];
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      app.SpacedRepService.recordAnswer(testChar, true);
      const due = app.SpacedRepService.getDueChars();
      assert(!due.includes(testChar), 'First correct answer should go to Box 2 (due tomorrow, not today)');
    });

    it('Correct answer increments box (Box 2 → Box 3)', () => {
      const testChar = '淼';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      // Manually set to Box 2 with review yesterday
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      data[testChar] = { box: 1, lastReview: yesterday, correctStreak: 1 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      // Should be due (1 day since Box 2 interval=1)
      assert(app.SpacedRepService.getDueChars().includes(testChar), 'Should be due before answering');

      app.SpacedRepService.recordAnswer(testChar, true);
      app.SpacedRepService.resetCache();
      const updated = app.State.load('spacedRep', {});
      assertEqual(updated[testChar].box, 2, `Should be Box 3 (index 2), got box=${updated[testChar].box}`);
    });

    it('Box 5 correct answer stays at Box 5 (max)', () => {
      const testChar = '焱';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      const old = new Date(Date.now() - 15 * 86400000).toISOString().slice(0, 10);
      data[testChar] = { box: 4, lastReview: old, correctStreak: 5 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      app.SpacedRepService.recordAnswer(testChar, true);
      app.SpacedRepService.resetCache();
      const updated = app.State.load('spacedRep', {});
      assertEqual(updated[testChar].box, 4, `Should stay at Box 5 (index 4), got box=${updated[testChar].box}`);
    });

    it('correctStreak increments on consecutive correct', () => {
      const testChar = '垚';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      data[testChar] = { box: 1, lastReview: new Date().toISOString().slice(0, 10), correctStreak: 2 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      app.SpacedRepService.recordAnswer(testChar, true);
      app.SpacedRepService.resetCache();
      const updated = app.State.load('spacedRep', {});
      assertEqual(updated[testChar].correctStreak, 3, `Expected streak=3, got ${updated[testChar].correctStreak}`);
    });
  });

  describe('📈 Spaced Repetition — Box Demotion (Wrong Answers)', () => {
    it('First wrong answer: enters system at Box 1, due immediately', () => {
      const testChar = '犇';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      delete data[testChar];
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      app.SpacedRepService.recordAnswer(testChar, false);
      const due = app.SpacedRepService.getDueChars();
      assert(due.includes(testChar), 'Wrong answer should be due immediately (Box 1, interval=0)');
    });

    it('Wrong answer from Box 3 drops to Box 1 (due immediately)', () => {
      const testChar = '骉';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      data[testChar] = { box: 2, lastReview: new Date().toISOString().slice(0, 10), correctStreak: 3 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      app.SpacedRepService.recordAnswer(testChar, false);
      app.SpacedRepService.resetCache();
      const updated = app.State.load('spacedRep', {});
      assertEqual(updated[testChar].box, 0, `Should drop to Box 1 (index 0), got box=${updated[testChar].box}`);
      // Check it's due immediately
      const due = app.SpacedRepService.getDueChars();
      assert(due.includes(testChar), 'Should be due immediately after wrong answer');
    });

    it('Wrong answer from Box 5 drops to Box 1 (due immediately)', () => {
      const testChar = '飝';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      data[testChar] = { box: 4, lastReview: new Date().toISOString().slice(0, 10), correctStreak: 10 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      app.SpacedRepService.recordAnswer(testChar, false);
      app.SpacedRepService.resetCache();
      const updated = app.State.load('spacedRep', {});
      assertEqual(updated[testChar].box, 0, `Should drop to Box 1, got box=${updated[testChar].box}`);
      assertEqual(updated[testChar].correctStreak, 0, 'correctStreak should reset to 0');
    });

    it('correctStreak resets to 0 on wrong answer', () => {
      const testChar = '麤';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      data[testChar] = { box: 3, lastReview: new Date().toISOString().slice(0, 10), correctStreak: 7 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      app.SpacedRepService.recordAnswer(testChar, false);
      app.SpacedRepService.resetCache();
      const updated = app.State.load('spacedRep', {});
      assertEqual(updated[testChar].correctStreak, 0, `Expected streak=0, got ${updated[testChar].correctStreak}`);
    });
  });

  describe('📈 Spaced Repetition — Due Date Logic', () => {
    it('Box 1 (interval=0): due same day', () => {
      const testChar = '厵';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      const today = new Date().toISOString().slice(0, 10);
      data[testChar] = { box: 0, lastReview: today, correctStreak: 0 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      const due = app.SpacedRepService.getDueChars();
      assert(due.includes(testChar), 'Box 1 char reviewed today should be due immediately');
    });

    it('Box 2 (interval=1): NOT due same day', () => {
      const testChar = '叒';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      const today = new Date().toISOString().slice(0, 10);
      data[testChar] = { box: 1, lastReview: today, correctStreak: 1 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      const due = app.SpacedRepService.getDueChars();
      assert(!due.includes(testChar), 'Box 2 char reviewed today should NOT be due (interval=1 day)');
    });

    it('Box 2 (interval=1): due after 1 day', () => {
      const testChar = '叕';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      data[testChar] = { box: 1, lastReview: yesterday, correctStreak: 1 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      const due = app.SpacedRepService.getDueChars();
      assert(due.includes(testChar), 'Box 2 char reviewed yesterday should be due today');
    });

    it('Box 3 (interval=3): NOT due after 2 days', () => {
      const testChar = '燊';
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      const twoDaysAgo = new Date(Date.now() - 2 * 86400000).toISOString().slice(0, 10);
      data[testChar] = { box: 2, lastReview: twoDaysAgo, correctStreak: 2 };
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      const due = app.SpacedRepService.getDueChars();
      assert(!due.includes(testChar), 'Box 3 char reviewed 2 days ago should NOT be due (interval=3)');
    });

    // Helper: seed favorites with chars from multiple grade-semesters
    function seedFavorites() {
      const allChars = app.State.get('allChars');
      // Pick chars that are UNIQUE to their grade-semester (not appearing in other semesters)
      const charsByGradeSem = {};
      allChars.forEach(c => {
        const key = `${c.grade}-${c.semester}`;
        if (!charsByGradeSem[key]) charsByGradeSem[key] = [];
        charsByGradeSem[key].push(c);
      });

      // Find chars unique to each semester (char string not in any other semester)
      const allCharStrings = {};
      allChars.forEach(c => {
        if (!allCharStrings[c.char]) allCharStrings[c.char] = new Set();
        allCharStrings[c.char].add(`${c.grade}-${c.semester}`);
      });

      function uniqueCharsFor(grade, sem, count) {
        const key = `${grade}-${sem}`;
        const pool = (charsByGradeSem[key] || []).filter(c => allCharStrings[c.char].size === 1);
        return pool.slice(0, count);
      }

      const g1s1Chars = uniqueCharsFor(1, 1, 3);
      const g1s2Chars = uniqueCharsFor(1, 2, 2);
      const g2s1Chars = uniqueCharsFor(2, 1, 4);

      // Clear favorites and add our test chars
      const favChars = [...g1s1Chars, ...g1s2Chars, ...g2s1Chars].map(c => c.char);
      app.State.save('favorites', favChars);
      app.State.set('favorites', favChars);
    }

  describe('📖 Daily Task — Recap (Previous Lesson)', () => {
    it('getRecapChars returns empty for first lesson', () => {
      app.DailyTaskService.initProgress(1, 1, 0); // First lesson
      const recapChars = app.DailyTaskService.getRecapChars();
      assertEqual(recapChars.length, 0, 'First lesson should have no recap');
    });

    it('getRecapChars returns previous lesson chars', () => {
      app.DailyTaskService.initProgress(1, 1, 1); // Second lesson
      const recapChars = app.DailyTaskService.getRecapChars();
      assertGreater(recapChars.length, 0, 'Second lesson should have recap chars from lesson 0');
      // Verify they match lesson 0's chars
      const lessons = app.State.get('lessons').filter(l => {
        const [g, s] = l.id.split('-');
        return parseInt(g) === 1 && parseInt(s) === 1;
      });
      const expectedChars = lessons[0].chars.map(c => c.char);
      recapChars.forEach(c => {
        assert(expectedChars.includes(c.char), `Recap char "${c.char}" should be from previous lesson`);
      });
    });
  });

  describe('📖 Daily Task — Growth Level', () => {
    it('getGrowthLevel returns valid structure', () => {
      const level = app.DailyTaskService.getGrowthLevel();
      assert(level.emoji, 'Should have emoji');
      assert(level.name, 'Should have name');
      assert(level.total !== undefined, 'Should have total');
      assert(level.nextEmoji, 'Should have nextEmoji');
      assert(level.nextName, 'Should have nextName');
      assert(level.progress !== undefined, 'Should have progress (0-1)');
    });

    it('Growth level progresses with more chars in SRS', () => {
      // Clear SRS
      app.State.save('spacedRep', {});
      app.SpacedRepService.resetCache();
      const level0 = app.DailyTaskService.getGrowthLevel();
      assertEqual(level0.name, '种子', 'Should be 种子 at 0 chars');

      // Add 50+ chars
      const data = {};
      const allChars = app.State.get('allChars');
      allChars.slice(0, 55).forEach(c => {
        data[c.char] = { box: 2, lastReview: new Date().toISOString().slice(0, 10), correctStreak: 2 };
      });
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();
      const level50 = app.DailyTaskService.getGrowthLevel();
      assertEqual(level50.name, '萌芽', 'Should be 萌芽 at 55 chars');
    });
  });

  describe('📖 Daily Task — Redo Today\'s Task', () => {
    it('Redo resets task state but keeps same lesson (non-advanced)', () => {
      // Setup: complete a lesson with < 60% (doesn't advance)
      app.DailyTaskService.initProgress(1, 1, 2);
      app.State.save('dailyTask', { date: '', step: 'review' });
      app.DailyTaskService.getTaskState();
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(3, 10); // 30% — doesn't advance

      const progressBefore = app.DailyTaskService.getProgress();
      assertEqual(progressBefore.lessonIndex, 2, 'Should stay at lesson 2 (not advanced)');

      // Simulate redo: reset task state
      const newState = {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      };
      app.State.save('dailyTask', newState);

      const state = app.DailyTaskService.getTaskState();
      assertEqual(state.step, 'review', 'Should restart at review');
      assertEqual(state.quizDone, false, 'quizDone should be false');
      const progressAfter = app.DailyTaskService.getProgress();
      assertEqual(progressAfter.lessonIndex, 2, 'Should still be at lesson 2');
    });

    it('Redo rolls back lesson index when already advanced (>= 60%)', () => {
      // Setup: complete a lesson with >= 60% (advances)
      app.DailyTaskService.initProgress(1, 1, 3);
      app.State.save('dailyTask', { date: '', step: 'review' });
      app.DailyTaskService.getTaskState();
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(8, 10); // 80% — advances

      const progressAdvanced = app.DailyTaskService.getProgress();
      assertEqual(progressAdvanced.lessonIndex, 4, 'Should have advanced to lesson 4');

      // Simulate redo: roll back + reset state
      const progress = app.DailyTaskService.getProgress();
      if (progress.lessonIndex > 0) {
        progress.lessonIndex--;
        if (progress.completedLessons.length > 0) progress.completedLessons.pop();
        app.State.save('lessonProgress', progress);
      }
      const newState = {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      };
      app.State.save('dailyTask', newState);

      const progressAfter = app.DailyTaskService.getProgress();
      assertEqual(progressAfter.lessonIndex, 3, 'Should roll back to lesson 3');
      const state = app.DailyTaskService.getTaskState();
      assertEqual(state.step, 'review', 'Should restart at review');
    });

    it('Redo preserves other profile data (favorites, errorBook)', () => {
      // Setup some profile data
      app.State.set('favorites', ['天', '地']);
      app.State.persist('favorites');
      const errBook = [{ char: '难', pinyin: 'nán', wrongCount: 2, consecutiveCorrect: 0 }];
      app.State.set('errorBook', errBook);
      app.State.persist('errorBook');

      // Complete and redo
      app.DailyTaskService.initProgress(1, 1, 0);
      app.State.save('dailyTask', { date: '', step: 'review' });
      app.DailyTaskService.getTaskState();
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(5, 10);

      // Reset task state (redo)
      const newState = {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      };
      app.State.save('dailyTask', newState);

      // Verify other data is untouched
      const favs = app.State.load('favorites', []);
      assert(favs.includes('天'), 'Favorites should be preserved after redo');
      const errors = app.State.load('errorBook', []);
      assertEqual(errors.length, 1, 'ErrorBook should be preserved after redo');
    });

    it('Multiple redos in same day all work correctly', () => {
      app.DailyTaskService.initProgress(1, 1, 0);

      // First run
      app.State.save('dailyTask', { date: '', step: 'review' });
      app.DailyTaskService.getTaskState();
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(9, 10); // advances to lesson 1

      assertEqual(app.DailyTaskService.getProgress().lessonIndex, 1);

      // Redo #1: roll back and reset
      let progress = app.DailyTaskService.getProgress();
      progress.lessonIndex--;
      if (progress.completedLessons.length > 0) progress.completedLessons.pop();
      app.State.save('lessonProgress', progress);
      app.State.save('dailyTask', {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      });

      assertEqual(app.DailyTaskService.getProgress().lessonIndex, 0, 'Should be back at lesson 0');
      assertEqual(app.DailyTaskService.getTaskState().step, 'review', 'Should be at review');

      // Second run
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(10, 10); // advances again

      assertEqual(app.DailyTaskService.getProgress().lessonIndex, 1, 'Should advance again to lesson 1');

      // Redo #2
      progress = app.DailyTaskService.getProgress();
      progress.lessonIndex--;
      if (progress.completedLessons.length > 0) progress.completedLessons.pop();
      app.State.save('lessonProgress', progress);
      app.State.save('dailyTask', {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      });

      assertEqual(app.DailyTaskService.getProgress().lessonIndex, 0, 'Should be back at lesson 0 again');
    });
  });

  renderResults();
}
</script>
