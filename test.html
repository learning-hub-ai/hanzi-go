<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>HanziGo — Test Suite</title>
<style>
body{font-family:-apple-system,sans-serif;max-width:900px;margin:40px auto;padding:0 20px;color:#1e293b}
h1{color:#4f46e5}
.controls{display:flex;gap:8px;margin-bottom:16px;align-items:center}
#runBtn{padding:10px 24px;background:#4f46e5;color:#fff;border:none;border-radius:8px;font-size:15px;cursor:pointer}
#runBtn:hover{background:#3730a3}
.filter-btn{padding:6px 14px;border:1px solid #e2e8f0;border-radius:6px;font-size:12px;cursor:pointer;background:#fff;color:#64748b}
.filter-btn.active{background:#fef2f2;border-color:#fca5a5;color:#dc2626;font-weight:600}
.test-group{margin:12px 0;border:1px solid #e2e8f0;border-radius:8px;overflow:hidden}
.test-group.all-pass{border-color:#d1fae5}
.test-group.has-fail{border-color:#fecaca}
.test-group-header{background:#f8fafc;margin:0;padding:10px 16px;border-bottom:1px solid #e2e8f0;font-size:14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;user-select:none}
.test-group.all-pass .test-group-header{background:#f0fdf4}
.test-group.has-fail .test-group-header{background:#fef2f2}
.test-group-header:hover{background:#f1f5f9}
.test-group-count{font-size:11px;color:#64748b;background:#e2e8f0;padding:2px 8px;border-radius:10px}
.test-group.has-fail .test-group-count{background:#fecaca;color:#dc2626}
.test-group-body{display:none}
.test-group.expanded .test-group-body{display:block}
.test-group.has-fail .test-group-body{display:block}
.test{padding:6px 16px;border-bottom:1px solid #f1f5f9;font-size:12px;display:flex;align-items:center;gap:8px}
.test:last-child{border-bottom:none}
.pass{color:#059669}
.fail{color:#ef4444;font-weight:600}
.pass::before{content:'✅ '}
.fail::before{content:'❌ '}
.hidden-test{display:none}
.summary{margin-top:24px;padding:16px;border-radius:8px;font-size:15px;font-weight:600}
.summary.all-pass{background:#dcfce7;color:#166534}
.summary.has-fail{background:#fef2f2;color:#991b1b}
iframe{width:100%;height:0;border:none;position:absolute;left:-9999px}
</style>
</head>
<body>
<h1>🧪 HanziGo Test Suite</h1>
<p>Automated tests to verify app functionality. Tests load the app in a hidden iframe.</p>
<div class="controls">
  <button id="runBtn" onclick="runTests()">▶ Run All Tests</button>
  <button class="filter-btn" id="filterBtn" onclick="toggleFilter()">Show failures only</button>
  <button class="filter-btn" id="collapseBtn" onclick="collapseAll()">Collapse all</button>
  <button class="filter-btn" id="expandBtn" onclick="expandAll()">Expand all</button>
</div>
<div id="results"><p style="color:#999">Click "Run All Tests" to start</p></div>

<!-- Hidden iframe loads the real app -->
<iframe id="appFrame" src="index.html"></iframe>

<script>
let tests = [];
let passed = 0;
let failed = 0;
let app; // reference to iframe's window

function describe(group, fn) { tests.push({ group, tests: [] }); fn(); }

/**
 * describe() with a per-test setup hook.
 *
 * Every test shares one iframe and one localStorage profile, so a group that
 * seeds spacedRep / errorBook / stats leaves that data behind and later
 * assertions silently measure the leftovers. That made two "totals match"
 * tests pass for the wrong reason: both sides counted the same polluted set.
 */
let _beforeEachFn = null;
function describeWith(group, setup, fn) {
  tests.push({ group, tests: [] });
  const prev = _beforeEachFn;
  _beforeEachFn = setup;
  try { fn(); } finally { _beforeEachFn = prev; }
}

/** Wipe per-profile learning data so a test starts from a known state. */
function resetProfileData() {
  if (!app || !app.State) return;
  app.State.save('spacedRep', {});
  if (app.SpacedRepService) app.SpacedRepService.resetCache();
  app.State.save('customCards', []);
  app.State.set('errorBook', []);     app.State.persist('errorBook');
  app.State.set('favorites', []);     app.State.persist('favorites');
  app.State.set('stats', {
    totalRounds: 0, totalCorrect: 0, totalAnswered: 0,
    streak: 0, lastPlayDate: '', consecutiveDays: 0, bestStreak: 0,
    perfectRounds: 0, totalEverWrong: 0, playDates: []
  });
  app.State.persist('stats');
  // Restore the study selection too. Tests that study a small collection (one
  // custom card, say) leave filteredChars pointing at it, and the quiz draws
  // its pool from there — so a later test asking for 10 mixed questions got
  // one, from one character, and saw only one question type.
  //
  // Order matters: applyFilter() reads selectedGrade/selectedSemester, so those
  // must be cleared BEFORE it runs. Setting them afterwards left it filtering
  // by whatever the previous test had selected.
  if (app.DataService) {
    app.State.set('selectedGrade', '');
    app.State.set('selectedSemester', '');
    app.State.set('currentIndex', 0);
    app.DataService.applyFilter('all');   // no grade/semester → the full set
  }
  // Fail loudly rather than letting a narrowed pool silently distort later
  // assertions — that is exactly how this bug hid twice.
  if (app.State.get('allChars') && app.State.get('allChars').length) {
    const pool = app.State.get('filteredChars') || [];
    if (pool.length < app.State.get('allChars').length) {
      throw new Error(
        `resetProfileData 没能恢复全量题库：filteredChars=${pool.length} / allChars=${app.State.get('allChars').length}`);
    }
  }
  if (app.FilterUI) {
    app.FilterUI.updateFavCount();
    app.FilterUI.updateErrCount();
    app.FilterUI.updateSrsCount();
    app.FilterUI.updateCustomCount();
  }
}

function it(name, fn) {
  const group = tests[tests.length - 1];
  try {
    if (_beforeEachFn) _beforeEachFn();
    fn();
    group.tests.push({ name, pass: true }); passed++;
  }
  catch (e) { group.tests.push({ name, pass: false, error: e.message }); failed++; }
}
function assert(cond, msg) { if (!cond) throw new Error(msg || 'Assertion failed'); }
function assertEqual(a, b, msg) { if (a !== b) throw new Error(msg || `Expected ${b}, got ${a}`); }
function assertGreater(a, min, msg) { if (a <= min) throw new Error(msg || `Expected > ${min}, got ${a}`); }

function renderResults() {
  let html = '';
  tests.forEach(group => {
    const groupFailed = group.tests.some(t => !t.pass);
    const groupClass = groupFailed ? 'has-fail expanded' : 'all-pass';
    const passCount = group.tests.filter(t => t.pass).length;
    const failCount = group.tests.filter(t => !t.pass).length;
    const countLabel = groupFailed ? `${failCount} failed` : `${passCount} passed`;

    html += `<div class="test-group ${groupClass}">`;
    html += `<div class="test-group-header" onclick="this.parentElement.classList.toggle('expanded')">
      <span>${groupFailed ? '❌' : '✅'} ${group.group}</span>
      <span class="test-group-count">${countLabel}</span>
    </div>`;
    html += `<div class="test-group-body">`;
    group.tests.forEach(t => {
      html += `<div class="test ${t.pass?'pass':'fail'}">${t.name}${t.error?' — '+t.error:''}</div>`;
    });
    html += '</div></div>';
  });
  html += `<div class="summary ${failed?'has-fail':'all-pass'}">${passed} passed, ${failed} failed (${passed+failed} total across ${tests.length} groups)</div>`;
  // Machine-readable marker for headless/CI runs (test.html?autorun=1)
  html += `<div id="ciSummary" style="display:none">CI_RESULT passed=${passed} failed=${failed} total=${passed+failed}</div>`;
  document.getElementById('results').innerHTML = html;
}

function toggleFilter() {
  const btn = document.getElementById('filterBtn');
  const groups = document.querySelectorAll('.test-group');
  btn.classList.toggle('active');
  const showFailOnly = btn.classList.contains('active');
  btn.textContent = showFailOnly ? 'Show all tests' : 'Show failures only';
  groups.forEach(g => {
    if (showFailOnly && g.classList.contains('all-pass')) {
      g.style.display = 'none';
    } else {
      g.style.display = '';
    }
  });
}

function collapseAll() {
  document.querySelectorAll('.test-group').forEach(g => g.classList.remove('expanded'));
}

function expandAll() {
  document.querySelectorAll('.test-group').forEach(g => g.classList.add('expanded'));
}

async function runTests() {
  tests = []; passed = 0; failed = 0;
  document.getElementById('results').innerHTML = '<p>Loading app in iframe...</p>';

  // Wait for iframe to load
  const frame = document.getElementById('appFrame');
  await new Promise(resolve => {
    if (frame.contentDocument.readyState === 'complete') resolve();
    else frame.onload = resolve;
  });

  // Wait for app to finish initializing (data loading is async)
  app = frame.contentWindow;
  for (let i = 0; i < 20; i++) {
    await new Promise(r => setTimeout(r, 500));
    try {
      if (app.State && app.State.get('allChars') && app.State.get('allChars').length > 0) break;
    } catch(e) {}
  }

  if (!app.State) {
    document.getElementById('results').innerHTML = '<p style="color:red">❌ Failed: app.State not accessible. Make sure test.html is served from the same origin (http://localhost:8080/test.html)</p>';
    return;
  }

  // === 1. Data Files ===
  describe('📂 Data Files', () => {
    it('allChars is loaded and non-empty', () => {
      const chars = app.State.get('allChars');
      assert(Array.isArray(chars), 'allChars should be array');
      assertGreater(chars.length, 100, `Only ${chars.length} chars loaded`);
    });

    it('Lessons loaded from multiple grades', () => {
      const lessons = app.State.get('lessons');
      assertGreater(lessons.length, 50, `Only ${lessons.length} lessons`);
    });

    it('Each char has required fields', () => {
      const chars = app.State.get('allChars');
      const sample = chars.slice(0, 50);
      sample.forEach(c => {
        assert(c.char && c.char.length === 1, `Bad char: ${c.char}`);
        assert(c.pinyin, `Missing pinyin for ${c.char}`);
        assert(c.words && c.words.length >= 1, `Missing words for ${c.char}`);
        assert(c.sentence, `Missing sentence for ${c.char}`);
      });
    });

    it('Chars contain the character in their sentence', () => {
      const chars = app.State.get('allChars');
      let missing = 0;
      chars.forEach(c => { if (!c.sentence.includes(c.char)) missing++; });
      assertEqual(missing, 0, `${missing} chars not in their sentence`);
    });

    it('DataService.getEdition returns the textbook print year for every grade/semester', () => {
      // Source of truth: docs/data-generation-spec.md §2.1 (底本依据), cross-checked
      // against the actual PDF filenames in keben/. Not every grade uses the same
      // print year — e.g. grade 2/3/8's 下册 predate their 上册's 2024 revision —
      // so this must be checked per grade+semester, not assumed uniform per grade.
      const expected = {
        '1-1': '2024', '1-2': '2024',
        '2-1': '2024', '2-2': '2017',
        '3-1': '2024', '3-2': '2018',
        '4-1': '2019', '4-2': '2019',
        '5-1': '2019', '5-2': '2019',
        '6-1': '2019', '6-2': '2019',
        '7-1': '2024', '7-2': '2024',
        '8-1': '2024', '8-2': '2017',
        '9-1': '2018', '9-2': '2018',
      };
      Object.entries(expected).forEach(([key, edition]) => {
        const [grade, sem] = key.split('-');
        const actual = app.DataService.getEdition(grade, sem);
        assertEqual(actual, edition, `grade ${grade} semester ${sem}: expected ${edition}, got ${actual}`);
      });
    });

    it('DataService.getEdition returns null for unknown grade/semester', () => {
      assertEqual(app.DataService.getEdition('custom', 'custom'), null, 'should be null for pseudo-grade "custom"');
      assertEqual(app.DataService.getEdition(99, 99), null, 'should be null for a grade that does not exist');
    });

    it('Sidebar shows the textbook edition next to each 上册/下册 item', () => {
      // FilterUI.updateStripCounts() injects a .sidebar-item-edition tag per
      // grade/semester item so parents can tell which print year the data
      // comes from (see DataService.getEdition).
      const items = app.document.querySelectorAll('[data-count-for]');
      assertGreater(items.length, 10, `expected 18 grade/semester sidebar items, found ${items.length}`);
      let withEdition = 0;
      items.forEach(el => {
        const parent = el.closest('.sidebar-item');
        const tag = parent && parent.querySelector('.sidebar-item-edition');
        if (tag && /^\d{4}版$/.test(tag.textContent)) withEdition++;
      });
      assertEqual(withEdition, items.length,
        `expected all ${items.length} sidebar items to show an edition tag, got ${withEdition}`);
    });
  });

  // === 2. HTML Structure ===
  describe('🏗️ HTML Structure', () => {
    const doc = frame.contentDocument;

    it('Critical learning elements exist', () => {
      const ids = ['flashcard', 'cardChar', 'favBtn', 'btnPrev', 'btnNext', 'btnFlip', 'btnSpeak', 'btnReinforce'];
      const missing = ids.filter(id => !doc.getElementById(id));
      assertEqual(missing.length, 0, `Missing: ${missing.join(', ')}`);
    });

    it('Critical challenge elements exist', () => {
      const ids = ['challengeMode', 'quizTypeSelector', 'quizOptions', 'btnPlayAgain'];
      const missing = ids.filter(id => !doc.getElementById(id));
      assertEqual(missing.length, 0, `Missing: ${missing.join(', ')}`);
    });

    it('Header elements exist', () => {
      const ids = ['streakNumber', 'btnProfile', 'btnFavorites', 'btnBadges'];
      const missing = ids.filter(id => !doc.getElementById(id));
      assertEqual(missing.length, 0, `Missing: ${missing.join(', ')}`);
    });

    it('Sidebar has grade items', () => {
      const items = doc.querySelectorAll('.sidebar-item[data-grade]');
      assertGreater(items.length, 10, `Only ${items.length} sidebar items`);
    });

    it('Mode tabs have data-mode', () => {
      const tabs = doc.querySelectorAll('.mode-tab[data-mode]');
      assertEqual(tabs.length, 3, 'Should have 3 mode tabs (任务, 学习, 挑战)');
    });
  });

  // === 3. JS Modules ===
  describe('📦 JS Modules', () => {
    it('State module loaded', () => {
      assert(typeof app.State !== 'undefined');
      assert(typeof app.State.get === 'function');
      assert(typeof app.State.set === 'function');
      assert(typeof app.State.config === 'function');
    });

    it('DataService module loaded', () => {
      assert(typeof app.DataService !== 'undefined');
      assert(typeof app.DataService.generateQuizQuestions === 'function');
    });

    it('Speech module loaded', () => {
      assert(typeof app.Speech !== 'undefined');
      assert(typeof app.Speech.speak === 'function');
    });

    it('BadgeService has 11 badges', () => {
      assertEqual(app.BadgeService.getAll().length, 11, 'Should have 11 badges');
    });

    it('LearnController loaded', () => {
      assert(typeof app.LearnController.next === 'function');
      assert(typeof app.LearnController.prev === 'function');
      assert(typeof app.LearnController.flip === 'function');
      assert(typeof app.LearnController.reinforce === 'function');
    });

    it('ChallengeController loaded', () => {
      assert(typeof app.ChallengeController.start === 'function');
      assert(typeof app.ChallengeController.setType === 'function');
    });

    it('ProfileManager loaded', () => {
      assert(typeof app.ProfileManager !== 'undefined');
      assert(typeof app.ProfileManager.getProfiles === 'function');
    });
  });

  // === 4. Quiz Logic ===
  describe('🎮 Quiz Logic', () => {
    it('Generates pickPinyin questions', () => {
      const q = app.DataService.generateQuizQuestions(false, 'pickPinyin', 5);
      assert(q !== null, 'Should generate questions');
      assertGreater(q.length, 0, 'Should have questions');
      assertEqual(q[0].type, 'pickPinyin');
      assertEqual(q[0].options.length, 4, 'Should have 4 options');
    });

    it('Generates pickChar questions', () => {
      const q = app.DataService.generateQuizQuestions(false, 'pickChar', 5);
      assert(q !== null);
      assertEqual(q[0].type, 'pickChar');
    });

    it('Generates fillBlank questions', () => {
      const q = app.DataService.generateQuizQuestions(false, 'fillBlank', 5);
      assert(q !== null);
      // fillBlank may fall back to pickChar for some chars
      assert(q[0].type === 'fillBlank' || q[0].type === 'pickChar');
    });

    it('Generates mixed questions', () => {
      // The generator picks a type at random per question, so a single run can
      // legitimately draw one type when the pool is small. Assert over several
      // runs and state the pool size, so a failure says which went wrong.
      const pool = app.State.get('filteredChars');
      assertGreater(pool.length, 10,
        `需要足够大的题库才能验证混合出题，当前只有 ${pool.length} 个字`);

      const seen = new Set();
      for (let run = 0; run < 5; run++) {
        const q = app.DataService.generateQuizQuestions(false, 'mixed', 10);
        assert(q !== null, 'generator returned null');
        assertEqual(q.length, 10, `expected 10 questions, got ${q.length}`);
        q.forEach(x => seen.add(x.type));
        if (seen.size > 1) break;
      }
      assertGreater(seen.size, 1,
        `mixed mode should produce more than one type across 5 runs, saw: ${[...seen].join(',')}`);
    });

    it('Correct answer is always in options', () => {
      const q = app.DataService.generateQuizQuestions(false, 'pickPinyin', 10);
      q.forEach(question => {
        assert(question.options.includes(question.target), 'Target must be in options');
      });
    });
  });

  // === 4b. Quiz Answer/Next-Question Timing (pronunciation race fix) ===
  describe('🔊 Quiz Feedback Audio Timing', () => {
    // Bug: the correct-answer pronunciation (Speech.speak) used to race a
    // fixed setTimeout that advanced to the next question. Speech's own
    // internal TIMEOUT_MS (2500ms) is larger than quizFeedbackDelayMs
    // (1200ms), so a slow audio source could start playing well after the
    // next question was already on screen — a child would hear the new
    // question's pronunciation attributed to the previous character.
    // Fix: advancing now waits for Speech.speak's onDone callback (capped
    // at quizFeedbackDelayMs so a dead audio source can't stall the quiz).

    function withMockedSpeech(mockSpeak, fn) {
      const real = app.Speech.speak;
      app.Speech.speak = mockSpeak;
      try { fn(); } finally { app.Speech.speak = real; }
    }

    it('on a correct answer, does not advance to the next question until Speech.speak signals onDone', () => {
      let capturedOnDone = null;
      withMockedSpeech((text, onDone) => { capturedOnDone = onDone; }, () => {
        app.AppController.switchMode('challenge');
        app.ChallengeController.start();
        const quiz = app.State.get('quiz');
        const correctIdx = quiz.questions[0].options.indexOf(quiz.questions[0].target);

        app.ChallengeController.answer(correctIdx);

        assert(typeof capturedOnDone === 'function', 'Speech.speak should have been called with a callback');
        assertEqual(app.State.get('quiz').current, 0,
          'must not have advanced yet — onDone has not fired');

        capturedOnDone();
        assertEqual(app.State.get('quiz').current, 1,
          'should advance immediately once onDone fires');
      });
    });

    it('on a correct answer, advances anyway if Speech.speak never calls onDone (ceiling fallback)', () => {
      // This harness's it() runs synchronously and does not await returned
      // promises, so we can't actually wait out a real timer here. Instead,
      // verify the ceiling is scheduled correctly: intercept setTimeout to
      // capture its delay, and invoke the captured callback ourselves to
      // simulate "time has passed" rather than actually waiting.
      let capturedDelay = null;
      let capturedCallback = null;
      const realSetTimeout = app.setTimeout;
      app.setTimeout = (fn, delay) => {
        capturedCallback = fn;
        capturedDelay = delay;
        return 0; // fake timer id; nothing clears it in this test
      };

      withMockedSpeech(() => { /* never calls onDone — simulates a dead/hanging audio source */ }, () => {
        app.AppController.switchMode('challenge');
        app.ChallengeController.start();
        const quiz = app.State.get('quiz');
        const correctIdx = quiz.questions[0].options.indexOf(quiz.questions[0].target);
        app.ChallengeController.answer(correctIdx);
      });

      app.setTimeout = realSetTimeout;

      const configuredDelay = app.State.config('quizFeedbackDelayMs', 1200);
      assertEqual(capturedDelay, configuredDelay,
        `the ceiling timer should be scheduled for quizFeedbackDelayMs (${configuredDelay}ms), got ${capturedDelay}`);
      assertEqual(app.State.get('quiz').current, 0, 'must not have advanced before the ceiling fires');

      // Simulate the ceiling firing (what would happen after configuredDelay ms)
      capturedCallback();
      assertEqual(app.State.get('quiz').current, 1,
        'should advance once the ceiling timer fires, even though onDone never did');
    });

    it('on a wrong answer, does not call Speech.speak at all', () => {
      let speakCalled = false;
      withMockedSpeech(() => { speakCalled = true; }, () => {
        app.AppController.switchMode('challenge');
        app.ChallengeController.start();
        const quiz = app.State.get('quiz');
        const correctIdx = quiz.questions[0].options.indexOf(quiz.questions[0].target);
        const wrongIdx = (correctIdx + 1) % quiz.questions[0].options.length;

        app.ChallengeController.answer(wrongIdx);
        assert(!speakCalled, 'a wrong answer should not trigger pronunciation');
      });
    });

    it('calling onDone twice does not double-advance', () => {
      // Guards the advanced-once latch in _advanceAfterSpeech: if both the
      // ceiling timer and a late onDone fired, the quiz must not skip a
      // question.
      let capturedOnDone = null;
      withMockedSpeech((text, onDone) => { capturedOnDone = onDone; }, () => {
        app.AppController.switchMode('challenge');
        app.ChallengeController.start();
        const quiz = app.State.get('quiz');
        const correctIdx = quiz.questions[0].options.indexOf(quiz.questions[0].target);
        app.ChallengeController.answer(correctIdx);
        capturedOnDone();
        capturedOnDone(); // simulate a duplicate/late invocation
      });
      assertEqual(app.State.get('quiz').current, 1, 'should have advanced exactly one question, not two');
    });
  });

  // === 5. Badge System ===
  describe('🏆 Badge System', () => {
    it('All badges have required fields', () => {
      app.BadgeService.getAll().forEach(b => {
        assert(b.id, `Missing id`);
        assert(b.emoji, `${b.id} missing emoji`);
        assert(b.name, `${b.id} missing name`);
        assert(b.desc !== undefined, `${b.id} missing desc`);
        assert(typeof b.check === 'function', `${b.id} missing check`);
      });
    });

    it('Badge IDs are unique', () => {
      const ids = app.BadgeService.getAll().map(b => b.id);
      assertEqual(ids.length, new Set(ids).size, 'Duplicate badge IDs');
    });

    it('checkAndAward returns array', () => {
      const result = app.BadgeService.checkAndAward();
      assert(Array.isArray(result), 'Should return array');
    });
  });

  // === 6. Profile System ===
  describe('👤 Profiles', () => {
    it('At least one profile exists', () => {
      assertGreater(app.ProfileManager.getProfiles().length, 0, 'No profiles');
    });

    it('Profile has id, name, avatar', () => {
      const p = app.ProfileManager.getProfiles()[0];
      assert(p.id, 'Missing id');
      assert(p.name, 'Missing name');
      assert(p.avatar, 'Missing avatar');
    });

    it('State has active profile', () => {
      const id = app.State.getProfileId();
      assert(id && id.length > 0, 'No active profile ID');
    });
  });

  // === 6b. Data Export / Import ===
  describe('💾 Data Transfer', () => {
    it('exportProfileData includes all eleven known keys', () => {
      const payload = app.State.exportProfileData();
      const expectedKeys = ['favorites', 'errorBook', 'stats', 'badges', 'spacedRep', 'customCards', 'favContext',
        'lessonProgress', 'dailyTask', 'growthPoints', 'completedLessonsHistory'];
      for (const k of expectedKeys) {
        assert(k in payload.data, `Export missing key: ${k}`);
      }
    });

    it('exportProfileData does NOT include derived/transient keys', () => {
      const payload = app.State.exportProfileData();
      const shouldNotBeExported = ['allChars', 'editions', 'lessons', 'filteredChars',
        'currentIndex', 'mode', 'quiz', 'selectedGrade', 'selectedSemester', 'showPinyin'];
      for (const k of shouldNotBeExported) {
        assert(!(k in payload.data), `Export should not include derived/transient key: ${k}`);
      }

  // Quiz distractors are biased toward characters the learner already knows,
  // so a quiz can't be solved by "pick the only familiar-looking option" —
  // see js/data.js _getDistractorPool(). Helper seeds spacedRep with a known
  // set of a given size (box=2 so SpacedRepService.getKnownChars() counts it).
  function seedKnownChars(count) {
    const sample = app.State.get('allChars').slice(0, count);
    const data = {};
    const today = new Date().toISOString().slice(0, 10);
    for (const c of sample) data[c.char] = { box: 2, lastReview: today };
    app.State.save('spacedRep', data);
    app.SpacedRepService.resetCache();
    return sample.map(c => c.char);
  }

  describeWith('🎯 Distractor Bias (anti-recognition-shortcut)', resetProfileData, () => {
    it('pickChar distractors come from known characters when enough are known', () => {
      const known = new Set(seedKnownChars(30));
      app.State.set('selectedGrade', 'all');
      app.State.set('selectedSemester', 'all');
      app.DataService.applyFilter('all');

      const q = app.DataService.generateQuizQuestions(false, 'pickChar', 20);
      assert(q !== null, 'should generate questions');
      for (const item of q) {
        const distractorChars = item.options.filter(o => o.char !== item.target.char).map(o => o.char);
        for (const c of distractorChars) {
          assert(known.has(c), `distractor ${c} is not from the known set (target was ${item.target.char})`);
        }
      }
    });

    it('pickPinyin distractors come from known characters when enough are known', () => {
      // getRandomDistractors dedups by pinyin (not by char), so a 30-char known
      // set can easily run out of distinct pinyins before filling 3 distractors
      // — it then legitimately tops up from the full pool (see js/data.js). Seed
      // enough known chars that running out of distinct known pinyins is very
      // unlikely, and assert on the common case rather than a tight guarantee.
      const known = new Set(seedKnownChars(300));
      const knownPinyins = new Set(
        [...known].map(c => app.State.get('allChars').find(a => a.char === c)?.pinyin)
      );
      app.State.set('selectedGrade', 'all');
      app.State.set('selectedSemester', 'all');
      app.DataService.applyFilter('all');

      const q = app.DataService.generateQuizQuestions(false, 'pickPinyin', 20);
      assert(q !== null, 'should generate questions');
      let fromKnown = 0, total = 0;
      for (const item of q) {
        const distractorPinyins = item.options.filter(o => o.pinyin !== item.target.pinyin);
        for (const opt of distractorPinyins) {
          total++;
          if (knownPinyins.has(opt.pinyin)) fromKnown++;
        }
      }
      assertGreater(fromKnown / total, 0.8,
        `expected most pinyin distractors to come from known chars, got ${fromKnown}/${total}`);
    });

    it('new learner (0 known chars) still gets full questions via fallback', () => {
      app.State.save('spacedRep', {});

      app.State.set('selectedGrade', 'all');

      const q = app.DataService.generateQuizQuestions(false, 'pickChar', 5);
      assert(q !== null, 'should still generate questions with 0 known chars');
      assertEqual(q.length, 5, `expected 5 questions, got ${q.length}`);
      for (const item of q) {
        assertEqual(item.options.length, 4, 'each question must still have 4 options');
      }
    });

    it('thin known pool (fewer than distractor count + 5) falls back to full pool', () => {
      seedKnownChars(2); // below the count(3)+5 threshold used by _getDistractorPool
      app.State.set('selectedGrade', 'all');
      app.State.set('selectedSemester', 'all');
      app.DataService.applyFilter('all');

      const q = app.DataService.generateQuizQuestions(false, 'pickChar', 5);
      assert(q !== null, 'should still generate questions with a thin known pool');
      for (const item of q) {
        assertEqual(item.options.length, 4, 'each question must still have 4 options even with a thin known pool');
      }
    });

    it('distractors never include the target character itself', () => {
      seedKnownChars(30);
      app.State.set('selectedGrade', 'all');
      app.State.set('selectedSemester', 'all');
      app.DataService.applyFilter('all');

      const q = app.DataService.generateQuizQuestions(false, 'pickChar', 20);
      for (const item of q) {
        const occurrences = item.options.filter(o => o.char === item.target.char).length;
        assertEqual(occurrences, 1, `target ${item.target.char} must appear exactly once among options`);
      }
    });
  });

    it('R8: front length picks a CSS size class, not an inline style', () => {
      // Re-query after every render instead of caching the element: app startup
      // replaces the whole main subtree via _getMainContentHTML(), so a cached
      // reference can become a detached node and report no classes at all.
      const cardChar = () => frame.contentDocument.getElementById('cardChar');
      const render = (front) =>
        app.CardUI.render({ char: front, pinyin: '', words: [], sentence: 'x' }, 0, 1);

      render('\u79e6');
      assertEqual(cardChar().className.includes('card-char--'), false,
        `a single character should use the default size, got "${cardChar().className}"`);

      render('\u79e6\u59cb\u7687');
      assert(cardChar().classList.contains('card-char--len4'),
        `a 3-char front should get card-char--len4, got "${cardChar().className}"`);

      assert(cardChar().classList.contains('card-char--long'),
        `a 6-char front should get card-char--long, got "${cardChar().className}"`);

      // Inline font-size would override the responsive clamp() in style.css
      assertEqual(cardChar().style.fontSize, '', 'sizing must come from CSS, not an inline style');

      // And the classes must not accumulate across renders
      render('\u5929');
      assertEqual(cardChar().className.includes('card-char--'), false,
        `size classes must be cleared when going back to one char, got "${cardChar().className}"`);
    });

      frame.contentDocument.getElementById('btnHelp').click();

      const box = frame.contentDocument.getElementById('modalBox');
      const rowW = row.getBoundingClientRect().width;

      const chars = rowW / fontPx;          // one CJK char ≈ 1em
      assert(chars <= 56, `about ${Math.round(chars)} chars per line — too long to track`);

      // Headless runs at a narrow viewport, so the rendered line is always
      // short here and the check above cannot see a desktop regression.
      // Assert the declared cap as well, which is viewport-independent.
      const capChars = parseFloat(frame.contentWindow.getComputedStyle(row).maxWidth) / fontPx;
      assert(capChars <= 58,
        `the measure cap allows about ${Math.round(capChars)} chars per line — too long on a wide screen`);

      // The lower bound cannot be checked at the current viewport (the modal is
      // only as wide as the screen allows), so assert the declared cap instead.
      // A `ch` unit here would compute to roughly half the intended width.
      const declared = frame.contentWindow.getComputedStyle(row).maxWidth;
      const capEm = parseFloat(declared) / fontPx;
      // 50em resolves to 650px here; 62ch to 447px — a 45% difference, and the
      // ch version computes to ~34 characters, so the bound has to sit above it.
      assert(capEm >= 44,
        `the measure cap resolves to about ${Math.round(capEm)} characters (${declared}) — ` +
        'too narrow; note 1ch is about half a CJK character, so use em');

      frame.contentDocument.getElementById('btnHelp').click();
      const win = frame.contentWindow;
      const parse = (c) => (c.match(/\d+/g) || []).slice(0, 3).map(Number);
      const lum = ([r, g, b]) => {
        const f = (v) => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); };
        return 0.2126 * f(r) + 0.7152 * f(g) + 0.0722 * f(b);

      const bandBg = parse(win.getComputedStyle(frame.contentDocument.querySelector('.help-sec')).backgroundColor);
      const l1 = lum(bandBg), l2 = lum([255, 255, 255]);
      const ratio = (Math.max(l1, l2) + 0.05) / (Math.min(l1, l2) + 0.05);
      assert(ratio >= 1.18,

    function injectFloatingBtn() {
      const doc = frame.contentDocument;
      const old = doc.getElementById('dtFloatingBtn');
      if (old) old.remove();
      const b = doc.createElement('button');
      b.id = 'dtFloatingBtn';
      b.className = 'dt-floating-btn dt-floating-btn-disabled';
      b.textContent = 'floating';
      doc.body.appendChild(b);
      return b;
    }

    it('leaving 任务 removes the floating button', () => {
      // It is appended to document.body with position:fixed, so it survived a
      // mode switch — the daily task only cleared it on its own re-render.
      app.AppController.switchMode('dailyTask');
      injectFloatingBtn();
      app.AppController.switchMode('challenge');
      assert(!frame.contentDocument.getElementById('dtFloatingBtn'),
        'the 已看 N/M button must not follow the user into 挑战');
    });

    it('it does not cover the last quiz option', () => {
      // Reported symptom: on a short phone the last answer was unclickable.
      app.AppController.switchMode('dailyTask');
      injectFloatingBtn();
      app.AppController.switchMode('challenge');
      app.ChallengeController.start();

      const btn = frame.contentDocument.getElementById('dtFloatingBtn');
      assert(!btn, 'precondition: the overlay should be gone');

      const opts = Array.from(frame.contentDocument.querySelectorAll('#quizOptions > *'));
      assertGreater(opts.length, 0, 'quiz should have rendered options');
      // Nothing fixed to the viewport should intersect the options
      const fixed = Array.from(frame.contentDocument.body.children).filter(el =>
        frame.contentWindow.getComputedStyle(el).position === 'fixed' &&
        el.offsetParent !== null);
      const last = opts[opts.length - 1].getBoundingClientRect();
      const covered = fixed.filter(el => {
        const r = el.getBoundingClientRect();
        if (!r.width || !r.height) return false;
        return !(r.bottom < last.top || r.top > last.bottom ||
                 r.right < last.left || r.left > last.right);
      }).map(el => el.id || el.className);
      assertEqual(covered.length, 0,
        `these fixed elements cover the last option: ${covered.join(', ')}`);
    });

    // Helper: seed favorites with chars from multiple grade-semesters
    function seedFavorites() {
      const allChars = app.State.get('allChars');
      // Pick chars that are UNIQUE to their grade-semester (not appearing in other semesters)
      const charsByGradeSem = {};
      allChars.forEach(c => {
        const key = `${c.grade}-${c.semester}`;
        if (!charsByGradeSem[key]) charsByGradeSem[key] = [];
        charsByGradeSem[key].push(c);
      });

      // Find chars unique to each semester (char string not in any other semester)
      const allCharStrings = {};
      allChars.forEach(c => {
        if (!allCharStrings[c.char]) allCharStrings[c.char] = new Set();
        allCharStrings[c.char].add(`${c.grade}-${c.semester}`);
      });

      function uniqueCharsFor(grade, sem, count) {
        const key = `${grade}-${sem}`;
        const pool = (charsByGradeSem[key] || []).filter(c => allCharStrings[c.char].size === 1);
        return pool.slice(0, count);
      }

      const g1s1Chars = uniqueCharsFor(1, 1, 3);
      const g1s2Chars = uniqueCharsFor(1, 2, 2);
      const g2s1Chars = uniqueCharsFor(2, 1, 4);

      // Clear favorites and add our test chars
      const favChars = [...g1s1Chars, ...g1s2Chars, ...g2s1Chars].map(c => c.char);
      app.State.save('favorites', favChars);
      app.State.set('favorites', favChars);
    }

      // Seed many due chars
      app.SpacedRepService.resetCache();
      const data = app.State.load('spacedRep', {});
      const today = new Date().toISOString().slice(0, 10);
      for (let i = 0; i < 20; i++) {
        data[`测${i}`] = { box: 0, lastReview: today, correctStreak: 0 };
      }
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      app.DailyTaskService.initProgress(1, 1, 0);
      const reviewChars = app.DailyTaskService.getReviewChars();
      assert(reviewChars.length <= 10, `Should be max 10, got ${reviewChars.length}`);
    });

    it('getReviewChars prioritizes lower boxes', () => {
      app.SpacedRepService.resetCache();
      const data = {};
      const today = new Date().toISOString().slice(0, 10);
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      const allChars = app.State.get('allChars');

      // Add some Box 1 chars (highest priority)
      allChars.slice(0, 5).forEach(c => {
        data[c.char] = { box: 0, lastReview: today, correctStreak: 0 };
      });
      // Add some Box 2 chars that are due
      allChars.slice(5, 10).forEach(c => {
        data[c.char] = { box: 1, lastReview: yesterday, correctStreak: 1 };
      });
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();

      app.DailyTaskService.initProgress(1, 1, 0);
      const reviewChars = app.DailyTaskService.getReviewChars();
      // First chars should be Box 1 (box=0)
      if (reviewChars.length > 0) {
        const srsData = app.State.load('spacedRep', {});
        const firstBox = srsData[reviewChars[0].char].box;
        assertEqual(firstBox, 0, 'First review char should be from Box 1 (most urgent)');
      }
    });
  });

  describe('📖 Daily Task — Recap (Previous Lesson)', () => {
    it('getRecapChars returns empty for first lesson', () => {
      app.DailyTaskService.initProgress(1, 1, 0); // First lesson
      const recapChars = app.DailyTaskService.getRecapChars();
      assertEqual(recapChars.length, 0, 'First lesson should have no recap');
    });

    it('getRecapChars returns previous lesson chars', () => {
      app.DailyTaskService.initProgress(1, 1, 1); // Second lesson
      const recapChars = app.DailyTaskService.getRecapChars();
      assertGreater(recapChars.length, 0, 'Second lesson should have recap chars from lesson 0');
      // Verify they match lesson 0's chars
      const lessons = app.State.get('lessons').filter(l => {
        const [g, s] = l.id.split('-');
        return parseInt(g) === 1 && parseInt(s) === 1;
      });
      const expectedChars = lessons[0].chars.map(c => c.char);
      recapChars.forEach(c => {
        assert(expectedChars.includes(c.char), `Recap char "${c.char}" should be from previous lesson`);
      });
    });
  });

  describe('📖 Daily Task — Growth Level', () => {
    it('getGrowthLevel returns valid structure', () => {
      const level = app.DailyTaskService.getGrowthLevel();
      assert(level.emoji, 'Should have emoji');
      assert(level.name, 'Should have name');
      assert(level.total !== undefined, 'Should have total');
      assert(level.nextEmoji, 'Should have nextEmoji');
      assert(level.nextName, 'Should have nextName');
      assert(level.progress !== undefined, 'Should have progress (0-1)');
    });

    it('Growth level progresses with more chars in SRS', () => {
      // Clear SRS
      app.State.save('spacedRep', {});
      app.SpacedRepService.resetCache();
      const level0 = app.DailyTaskService.getGrowthLevel();
      assertEqual(level0.name, '种子', 'Should be 种子 at 0 chars');

      // Add 50+ chars
      const data = {};
      const allChars = app.State.get('allChars');
      allChars.slice(0, 55).forEach(c => {
        data[c.char] = { box: 2, lastReview: new Date().toISOString().slice(0, 10), correctStreak: 2 };
      });
      app.State.save('spacedRep', data);
      app.SpacedRepService.resetCache();
      const level50 = app.DailyTaskService.getGrowthLevel();
      assertEqual(level50.name, '萌芽', 'Should be 萌芽 at 55 chars');
    });
  });

  describe('📖 Daily Task — Redo Today\'s Task', () => {
    it('Redo resets task state but keeps same lesson (non-advanced)', () => {
      // Setup: complete a lesson with < 60% (doesn't advance)
      app.DailyTaskService.initProgress(1, 1, 2);
      app.State.save('dailyTask', { date: '', step: 'review' });
      app.DailyTaskService.getTaskState();
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(3, 10); // 30% — doesn't advance

      const progressBefore = app.DailyTaskService.getProgress();
      assertEqual(progressBefore.lessonIndex, 2, 'Should stay at lesson 2 (not advanced)');

      // Simulate redo: reset task state
      const newState = {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      };
      app.State.save('dailyTask', newState);

      const state = app.DailyTaskService.getTaskState();
      assertEqual(state.step, 'review', 'Should restart at review');
      assertEqual(state.quizDone, false, 'quizDone should be false');
      const progressAfter = app.DailyTaskService.getProgress();
      assertEqual(progressAfter.lessonIndex, 2, 'Should still be at lesson 2');
    });

    it('Redo rolls back lesson index when already advanced (>= 60%)', () => {
      // Setup: complete a lesson with >= 60% (advances)
      app.DailyTaskService.initProgress(1, 1, 3);
      app.State.save('dailyTask', { date: '', step: 'review' });
      app.DailyTaskService.getTaskState();
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(8, 10); // 80% — advances

      const progressAdvanced = app.DailyTaskService.getProgress();
      assertEqual(progressAdvanced.lessonIndex, 4, 'Should have advanced to lesson 4');

      // Simulate redo: roll back + reset state
      const progress = app.DailyTaskService.getProgress();
      if (progress.lessonIndex > 0) {
        progress.lessonIndex--;
        if (progress.completedLessons.length > 0) progress.completedLessons.pop();
        app.State.save('lessonProgress', progress);
      }
      const newState = {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      };
      app.State.save('dailyTask', newState);

      const progressAfter = app.DailyTaskService.getProgress();
      assertEqual(progressAfter.lessonIndex, 3, 'Should roll back to lesson 3');
      const state = app.DailyTaskService.getTaskState();
      assertEqual(state.step, 'review', 'Should restart at review');
    });

    it('Redo preserves other profile data (favorites, errorBook)', () => {
      // Setup some profile data
      app.State.set('favorites', ['天', '地']);
      app.State.persist('favorites');
      const errBook = [{ char: '难', pinyin: 'nán', wrongCount: 2, consecutiveCorrect: 0 }];
      app.State.set('errorBook', errBook);
      app.State.persist('errorBook');

      // Complete and redo
      app.DailyTaskService.initProgress(1, 1, 0);
      app.State.save('dailyTask', { date: '', step: 'review' });
      app.DailyTaskService.getTaskState();
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(5, 10);

      // Reset task state (redo)
      const newState = {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      };
      app.State.save('dailyTask', newState);

      // Verify other data is untouched
      const favs = app.State.load('favorites', []);
      assert(favs.includes('天'), 'Favorites should be preserved after redo');
      const errors = app.State.load('errorBook', []);
      assertEqual(errors.length, 1, 'ErrorBook should be preserved after redo');
    });

    it('Multiple redos in same day all work correctly', () => {
      app.DailyTaskService.initProgress(1, 1, 0);

      // First run
      app.State.save('dailyTask', { date: '', step: 'review' });
      app.DailyTaskService.getTaskState();
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(9, 10); // advances to lesson 1

      assertEqual(app.DailyTaskService.getProgress().lessonIndex, 1);

      // Redo #1: roll back and reset
      let progress = app.DailyTaskService.getProgress();
      progress.lessonIndex--;
      if (progress.completedLessons.length > 0) progress.completedLessons.pop();
      app.State.save('lessonProgress', progress);
      app.State.save('dailyTask', {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      });

      assertEqual(app.DailyTaskService.getProgress().lessonIndex, 0, 'Should be back at lesson 0');
      assertEqual(app.DailyTaskService.getTaskState().step, 'review', 'Should be at review');

      // Second run
      app.DailyTaskService.completeReview(0);
      app.DailyTaskService.completeRecap(0);
      app.DailyTaskService.completeLearn();
      app.DailyTaskService.completeQuiz(10, 10); // advances again

      assertEqual(app.DailyTaskService.getProgress().lessonIndex, 1, 'Should advance again to lesson 1');

      // Redo #2
      progress = app.DailyTaskService.getProgress();
      progress.lessonIndex--;
      if (progress.completedLessons.length > 0) progress.completedLessons.pop();
      app.State.save('lessonProgress', progress);
      app.State.save('dailyTask', {
        date: new Date().toISOString().slice(0, 10),
        step: 'review', reviewDone: false, recapDone: false,
        learnDone: false, learnedChars: [], quizDone: false,
        quizScore: 0, quizTotal: 0, growthEarned: 0
      });

      assertEqual(app.DailyTaskService.getProgress().lessonIndex, 0, 'Should be back at lesson 0 again');
    });
  });

  renderResults();

  // Leave the app in a usable state. Tests narrow filteredChars to tiny
  // collections; without this the page you are looking at after a run has a
  // one-character study set, which is confusing and looks like a bug.
  try { resetProfileData(); } catch (e) { /* reporting already done */ }
}

// Allow headless/CI runs without a click: test.html?autorun=1
// Sets #ciSummary to a single parseable line when finished.
window.addEventListener('load', () => {
  if (new URLSearchParams(location.search).get('autorun') === '1') {
    runTests();
  }
});
</script>
</body>
